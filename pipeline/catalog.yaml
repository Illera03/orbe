- id: anomalia-temperatura
  sourceCode: annual-temperature-anomalies
  order: desc
  name:
    es: Anomalía de temperatura
    en: Temperature anomaly
  description:
    es: Diferencia entre la temperatura media en superficie del año y la media de 1991–2020 del mismo país.
    en: Difference between the year's average surface temperature and the country's 1991–2020 average.
  unit:
    es: °C
    en: °C
  decimals: 2
  category: medio-ambiente
  layer: choropleth
  scale:
    kind: diverging
    transform: linear
    palette: puor
    midpoint: 0
    domain: [-2, 2]
  source:
    module: owid
    name: Our World in Data, a partir de Copernicus Climate Change Service (ERA5)
