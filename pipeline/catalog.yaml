# Definición de indicadores. Cada entrada se valida con `Entry` (build_data.py).
# `source.module` es el módulo de pipeline/sources/ que descarga los datos;
# `scale.domain` [mín, máx] es opcional: fija el dominio de color (si falta, percentiles 2–98 de latestYear).
# `range` es el rango plausible [mín, máx]: un valor fuera de él impide publicar el indicador.
# `since` (opcional) es el primer año publicado: los anteriores se descartan antes de validar.
# Categorías: demografia, economia, salud, educacion, medio-ambiente, energia, geografia, sociedad.

- id: esperanza-vida
  sourceCode: SP.DYN.LE00.IN
  order: desc
  name:
    es: Esperanza de vida al nacer
    en: Life expectancy at birth
  description:
    es: Años que viviría un recién nacido si se mantuvieran los patrones de mortalidad del año de su nacimiento.
    en: Number of years a newborn would live if the mortality patterns at the time of birth stayed the same.
  unit:
    es: años
    en: years
  decimals: 1
  category: salud
  layer: choropleth
  scale:
    kind: sequential
    transform: linear
    palette: viridis
    domain: [45, 85]  # Diseño: con el dominio del último año, 1960 sale entero en el extremo bajo
  source:
    module: worldbank
    name: World Bank, World Development Indicators
    url: https://data.worldbank.org/indicator/SP.DYN.LE00.IN
  license:
    id: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
    attribution: "World Bank, World Development Indicators (SP.DYN.LE00.IN), CC BY 4.0"
    commercial: true
  range: [10, 100]

# Our World in Data. Cada serie hereda la licencia de su fuente original (comprobada serie a serie, D58).
- id: co2-total
  sourceCode: annual-co2-emissions-per-country
  order: desc
  name:
    es: Emisiones de CO₂
    en: CO₂ emissions
  description:
    es: Emisiones anuales de dióxido de carbono de combustibles fósiles e industria, sin cambios de uso del suelo.
    en: Annual carbon dioxide emissions from fossil fuels and industry, excluding land-use change.
  unit:
    es: toneladas
    en: tonnes
  decimals: 0
  category: medio-ambiente
  layer: choropleth
  scale:
    kind: sequential
    transform: log
    palette: viridis
  source:
    module: owid
    name: Our World in Data, a partir de Global Carbon Project (Global Carbon Budget)
    url: https://ourworldindata.org/grapher/annual-co2-emissions-per-country
  license:
    id: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Global Carbon Project, Global Carbon Budget – with major processing by Our World in Data, CC BY 4.0"
    commercial: true
  range: [0, 20000000000]

- id: co2-per-capita
  sourceCode: co2-emissions-per-capita
  order: desc
  name:
    es: Emisiones de CO₂ per cápita
    en: CO₂ emissions per capita
  description:
    es: Emisiones anuales de dióxido de carbono de combustibles fósiles e industria por habitante, sin cambios de uso del suelo.
    en: Annual carbon dioxide emissions from fossil fuels and industry per person, excluding land-use change.
  unit:
    es: t por persona
    en: t per person
  decimals: 2
  category: medio-ambiente
  layer: choropleth
  scale:
    kind: sequential
    transform: linear
    palette: viridis
  source:
    module: owid
    name: Our World in Data, a partir de Global Carbon Project (Global Carbon Budget)
    url: https://ourworldindata.org/grapher/co2-emissions-per-capita
  license:
    id: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
    attribution: "Global Carbon Project, Global Carbon Budget; population based on various sources – with major processing by Our World in Data, CC BY 4.0"
    commercial: true
  range: [0, 1500]  # Sint Maarten llega a 1062 t/persona en los años 50 (refinería con muy poca población)

