name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Puerta rápida (check obligatorio en main, D41): lint, tests, build, presupuesto de JS y pytest, en ≈ 30 s.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Tests del pipeline (pytest)
        working-directory: .
        run: |
          uv sync --directory pipeline --locked
          uv run --directory pipeline pytest
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Presupuesto de JS inicial (500 KB gzip)
        run: node tests/presupuesto-js.mjs

  # Comprobaciones lentas (D41): Lighthouse, e2e y capturas. En los PR avisan sin bloquear el merge;
  # en main se ejecutan tras integrar y un rojo se arregla en el momento.
  pesado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Aserciones con los umbrales de lighthouserc.cjs (D39).
      - name: Lighthouse escritorio
        run: npx lhci autorun --config=lighthouserc.cjs
        env:
          LH_FORM: desktop
      - name: Lighthouse móvil
        run: npx lhci autorun --config=lighthouserc.cjs
        env:
          LH_FORM: mobile
      - if: ${{ !cancelled() }}
        run: node tests/lighthouse-resumen.mjs >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: web/lighthouse/
          retention-days: 14
      # Las e2e corren aunque Lighthouse dé rojo, para no ocultar sus fallos.
      - name: Versión de Playwright
        if: ${{ !cancelled() }}
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Con caché solo se instalan las dependencias del sistema; sin ella, también los navegadores.
      - if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 8
      # Traza de los fallos (con los tiempos de cada paso) en el artefacto informe-playwright.
      - if: ${{ !cancelled() }}
        run: npm run e2e -- --trace=retain-on-failure
      # Las capturas y su subida no dependen de que e2e pase; informe y resultados aparte para no pisar los de e2e.
      - if: ${{ !cancelled() }}
        run: npm run capturas -- --output=test-results-capturas
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-capturas
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: web/capturas/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright
          path: |
            web/playwright-report*/
            web/test-results*/
          retention-days: 14
