name: attribution
on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mensajes de commit
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$'; then range="$BEFORE..$HEAD"
          else range="$HEAD"; fi
          git log --format=%B "$range" | .githooks/check-attribution.sh
      - name: Descripción del PR
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | .githooks/check-attribution.sh
